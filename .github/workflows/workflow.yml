name: Daily levels analysis

on:
  schedule:
    - cron: "30 0 * * 1-5"   # 03:30 Kenya time (EAT = UTC+3): Asian session
    - cron: "0 9 * * 1-5"    # 12:00 Kenya time: London session
    - cron: "33 14 * * 1-5"  # 17:33 Kenya time: New York session
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: levels
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python make_levels.py
      - name: Commit levels
        run: |
          git config user.name "levels-bot"
          git config user.email "levels-bot@users.noreply.github.com"
          git add levels.json data_prev.json
          git diff --cached --quiet || (git commit -m "Levels $(date -u +%F-%H%M)" && git push)
